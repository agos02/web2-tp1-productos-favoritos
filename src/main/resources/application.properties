spring.application.name=api-blank

# Base de datos (ver docker-compose.yml).
# Cada valor se puede sobrescribir con una variable de entorno; si no existe, se usa el valor de la derecha.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT.
# El valor por defecto es SOLO para desarrollo local: en producción hay que definir JWT_SECRET
# (HS256 exige una clave de al menos 32 caracteres).
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion-123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}